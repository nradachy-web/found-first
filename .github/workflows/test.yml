name: Validate public website
on:
  pull_request:
  push:
    branches-ignore: [main]
permissions:
  contents: read
jobs:
  public-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check app.js
      - run: node --check research.js
      - run: node --check inquiry.js
      - run: node tools/validate-public-content.mjs
      - run: node --test tests/*.test.mjs
      - run: node tools/build-public.mjs
